name: Find missing journalists

# Manual only. Searches LinkedIn and Muck Rack previews (via Brave) for
# journalists at outlets the scraper can't read: ITV, Sky, Channel 4 and 5,
# LBC, The Times, Sunday Times, FT, The Sun, Reuters, Farmers Weekly, ENDS.
#
# Every search counts towards the shared 900-in-30-days limit, so it always
# stays inside Brave's free credit.

on:
  workflow_dispatch:
    inputs:
      max_searches:
        description: 'Most searches to use (the full list is about 52)'
        required: false
        default: '60'
      outlets:
        description: 'Only these outlets, separated by commas (blank = all)'
        required: false
        default: ''

concurrency:
  group: database-writer
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests beautifulsoup4 feedparser
      - name: Find journalists
        working-directory: scraper
        env:
          BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
        run: |
          python discover.py --max-searches "${{ github.event.inputs.max_searches || '60' }}" \
            --outlets "${{ github.event.inputs.outlets }}"
      - name: Give new people emails and patches
        working-directory: scraper
        run: |
          python consolidate.py
          python enrich_profiles.py --stories-only
      - name: Commit and push results
        run: |
          set +e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          cp data/journalists.db /tmp/data.db
          git fetch origin main
          git reset --hard origin/main
          mkdir -p docs/data
          cp /tmp/data.db data/journalists.db
          cp /tmp/data.db docs/data/journalists.db
          git add data/journalists.db docs/data/journalists.db
          git diff --cached --quiet && exit 0
          git commit -m "Found missing journalists: $(date -u +%Y-%m-%d)"
          for a in 1 2 3; do git push origin main && exit 0; sleep $((5*a)); done
          exit 1
